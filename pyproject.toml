[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "complaint-warehouse"
version = "0.1.0"
description = "PostgreSQL + pgvector warehouse over the CFPB Consumer Complaint Database with analytics and hybrid search."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Farhan Patel" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.8",
    "sqlfluff>=3.1",
    "pre-commit>=3.8",
]

[project.urls]
Repository = "https://github.com/farhanpatel-dev/complaint-warehouse"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
complaint_warehouse = ["**/*.sql"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that need a running Postgres (set DATABASE_URL)",
]
