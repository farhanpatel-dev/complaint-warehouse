name: complaint-warehouse

services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: cw-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-complaints}
      POSTGRES_USER: ${POSTGRES_USER:-cw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cw}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Tuned for a laptop running analytics + vector index builds.
    # maintenance_work_mem matters most: HNSW/IVFFlat builds spill to disk without it.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - work_mem=64MB
      - -c
      - max_parallel_maintenance_workers=2
      - -c
      - shared_preload_libraries=pg_stat_statements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 1gb

  # API server. `make up` starts this and db.
  app:
    <<: &app-common
      build:
        context: .
        dockerfile: Dockerfile
      image: complaint-warehouse-app
      env_file:
        - path: .env
          required: false
      environment:
        DATABASE_URL: postgresql://${POSTGRES_USER:-cw}:${POSTGRES_PASSWORD:-cw}@db:5432/${POSTGRES_DB:-complaints}
        POSTGRES_USER: ${POSTGRES_USER:-cw}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cw}
        POSTGRES_DB: ${POSTGRES_DB:-complaints}
        DBT_HOST: db
        DBT_PORT: "5432"
        DBT_PROFILES_DIR: /app/dbt
      depends_on:
        db:
          condition: service_healthy
      volumes:
        - ./data:/app/data
        - ./dbt:/app/dbt
        - hf-cache:/root/.cache/huggingface
    container_name: cw-app
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Batch jobs (ingest, dbt, embed, bench) via `docker compose run --rm worker ...`.
  # Same image as app, but no published port and no HTTP healthcheck: a job container
  # runs no web server. The `jobs` profile keeps `docker compose up` from starting it.
  worker:
    <<: *app-common
    profiles: ["jobs"]
    command: ["true"]

volumes:
  pgdata:
  hf-cache:
