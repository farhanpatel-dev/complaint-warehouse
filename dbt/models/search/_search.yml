version: 2

models:
  - name: complaint_text
    description: >
      Narrative chunks for hybrid search. One row per (complaint_id, chunk_no): overlapping
      200-word windows of the redaction-free narrative, with a tsvector for full-text search
      and a 768-dim embedding filled by the embedding job.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [complaint_id, chunk_no]
    columns:
      - name: complaint_id
        description: FK to fact_complaint / raw narrative.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_cfpb__narratives')
                field: complaint_id
      - name: chunk_no
        description: 0-based chunk position within the narrative.
        data_tests: [not_null]
      - name: narrative
        description: Chunk text (redaction tokens removed).
        data_tests: [not_null]
      - name: tsv
        description: to_tsvector('english', narrative); GIN-indexed.
        data_tests: [not_null]
      - name: embedding
        description: Sentence embedding, vector(768); NULL until the embedding job processes the chunk.
      - name: embedding_model
        description: Model id that produced the embedding (lets a model change be detected and re-run).
      - name: embedded_at
        description: When the embedding was written.
      - name: source_changed_at
        description: last_changed_at of the source narrative; the incremental watermark.

  - name: complaint_facets
    description: >
      One row per complaint with a narrative: the attributes search filters on and displays
      (date, company, product and current product family, issue, state, response). Unpartitioned
      and keyed on complaint_id, so search avoids probing every monthly partition of the fact.
    columns:
      - name: complaint_id
        description: Complaint id; one row per complaint that has a narrative.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_cfpb__narratives')
                field: complaint_id
      - name: date_received
        data_tests: [not_null]
      - name: product_family
        description: Family from the current product taxonomy (stable across CFPB renames).
        data_tests: [not_null]
      - name: company_name
        data_tests: [not_null]
