name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      - run: sqlfluff lint db sql

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_DB: complaints
          POSTGRES_USER: cw
          POSTGRES_PASSWORD: cw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cw -d complaints"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://cw:cw@localhost:5432/complaints
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Initialise database (same scripts compose runs on first start)
        run: |
          for f in db/init/*.sql; do
            PGPASSWORD=cw psql -h localhost -U cw -d complaints -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Unit tests
        run: pytest -m "not integration" --cov=complaint_warehouse --cov-report=term-missing
      - name: Integration tests
        run: pytest -m integration

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app image
        run: docker build -t complaint-warehouse:ci .
