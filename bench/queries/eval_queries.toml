# Labelled queries for the search-quality evaluation (python -m complaint_warehouse.bench quality).
#
# Ground truth comes from the CFPB's own metadata, not from my judgement of the results:
# when consumers file a complaint they pick a product, an issue and a sub-issue. Each query
# is written the way a consumer might phrase that problem, deliberately not copying the
# category wording, and is labelled with the category it describes. Within the window:
#
#   grade 2  same product family, issue and sub-issue (or same issue, if it has no sub-issues)
#   grade 1  same product family and issue, different sub-issue
#   grade 0  everything else
#
# The labels are noisy (a consumer can pick a nearby category, and one complaint can
# describe several problems), but the noise is the same for every retrieval method, so the
# comparison between methods is fair. Absolute scores are a lower bound.
#
# Every label below has at least 100 complaints with a narrative in the window.

[window]
date_from = 2019-01-01
date_to = 2019-12-31

# --- Bank accounts ----------------------------------------------------------------------

[[query]]
id = "bank-deposit-hold"
text = "bank put a hold on my deposit and won't release the money"
product_family = "Bank accounts"
issue = "Managing an account"
sub_issue = "Deposits and withdrawals"

[[query]]
id = "bank-unauthorized-withdrawal"
